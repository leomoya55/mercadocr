<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 102">
  <defs>

    <!-- Warm muted gold — matches #e8c97a navbar text but slightly richer -->
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#E0B84A"/>
      <stop offset="100%" stop-color="#B8891C"/>
    </linearGradient>

    <!-- Deep navy — Costa Rica blue, desaturated for dark UI -->
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1C3C8C"/>
      <stop offset="100%" stop-color="#0E2460"/>
    </linearGradient>

    <!-- Deep crimson — Costa Rica red, toned down -->
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B01020"/>
      <stop offset="100%" stop-color="#7A0B16"/>
    </linearGradient>

    <!-- Clip to basket shape (open-top trapezoid) -->
    <clipPath id="basket">
      <path d="M10,5 H90 L70,74 Q68,80 60,80 H30 Q22,80 20,74 Z"/>
    </clipPath>

  </defs>

  <!-- ── Flag stripes clipped inside basket ──────────────────────────── -->
  <g clip-path="url(#basket)">
    <!-- Left navy -->
    <path d="M0,0  H33 L53,80 H0  Z"    fill="url(#navy)"/>
    <!-- Warm off-white divider -->
    <path d="M33,0 H42 L62,80 H53 Z"    fill="#DDD8CE"/>
    <!-- Crimson centre -->
    <path d="M42,0 H66 L86,80 H62 Z"    fill="url(#crimson)"/>
    <!-- Warm off-white divider -->
    <path d="M66,0 H75 L95,80 H86 Z"    fill="#DDD8CE"/>
    <!-- Right navy -->
    <path d="M75,0 H120 V80 H95 Z"      fill="url(#navy)"/>
  </g>

  <!-- ── Cart outline — single continuous stroke ──────────────────────── -->
  <!--
    Traces: left side → bottom arc → right side →
    cubic bézier into handle → straight grip
  -->
  <path d="M10,5
           L20,74 Q22,80 30,80 H60 Q68,80 70,74
           L90,5
           C99,4 114,14 114,30
           L114,56"
        fill="none"
        stroke="url(#gold)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Axle bar -->
  <line x1="26" y1="83" x2="68" y2="83"
        stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="34" cy="93" r="9"  fill="url(#gold)"/>
  <circle cx="60" cy="93" r="9"  fill="url(#gold)"/>

</svg>
