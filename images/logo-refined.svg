<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200">
  <defs>
    <clipPath id="basket">
      <rect x="20" y="30" width="140" height="108" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- ── Flag stripes — vivid CR colors, clipped to rounded basket ── -->
  <g clip-path="url(#basket)">
    <!-- Blue base fills entire basket -->
    <rect x="0" y="0" width="220" height="220" fill="#0038A8"/>

    <!-- Left white swoosh -->
    <path d="M 60,20  C 44,74  58,136  50,145
             L 76,145
             C 84,136  70,74   86,20 Z"
          fill="#FFFFFF"/>

    <!-- Red centre band -->
    <path d="M 86,20  C 70,74  84,136  76,145
             L 130,145
             C 138,136 124,74  140,20 Z"
          fill="#CE1126"/>

    <!-- Right white swoosh -->
    <path d="M 140,20 C 124,74 138,136 130,145
             L 156,145
             C 164,136 150,74  166,20 Z"
          fill="#FFFFFF"/>

    <!-- Right blue — base layer already covers it -->
  </g>

  <!-- ── Gold cart — color exactly #e8c97a, matching MercadoCR text ── -->

  <!-- Basket border -->
  <rect x="20" y="30" width="140" height="108" rx="20" ry="20"
        fill="none"
        stroke="#e8c97a"
        stroke-width="12"/>

  <!-- Handle: attaches upper-right of basket, curves up into hook, drops as grip -->
  <path d="M 160,68
           C 176,60 190,50 190,34
           Q 190,20 174,20"
        fill="none"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Grip — vertical bar -->
  <line x1="190" y1="34" x2="190" y2="128"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Axle -->
  <line x1="44" y1="154" x2="152" y2="154"
        stroke="#e8c97a"
        stroke-width="11"
        stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="64"  cy="172" r="16" fill="#e8c97a"/>
  <circle cx="132" cy="172" r="16" fill="#e8c97a"/>

</svg>
