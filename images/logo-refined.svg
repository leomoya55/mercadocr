<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 192">
  <defs>
    <clipPath id="basket">
      <rect x="12" y="22" width="142" height="108" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- ── Flag colors — open, no gold border around them ─────────────── -->
  <g clip-path="url(#basket)">
    <rect x="0" y="0" width="210" height="192" fill="#0038A8"/>

    <!-- Left white swoosh -->
    <path d="M 56,14  C 40,68  54,130  46,138
             L 72,138
             C 80,130  66,68   82,14 Z"
          fill="#FFFFFF"/>

    <!-- Red centre -->
    <path d="M 82,14  C 66,68  80,130  72,138
             L 124,138
             C 132,130 118,68  134,14 Z"
          fill="#CE1126"/>

    <!-- Right white swoosh -->
    <path d="M 134,14 C 118,68 132,130 124,138
             L 150,138
             C 158,130 144,68  160,14 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- ── Gold cart frame — ONE continuous stroke: bottom rail → right side → handle hook ── -->
  <path d="M 40,144
           L 150,144
           L 150,52
           C 150,34 163,22 180,22"
        fill="none"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Wheel legs — connect wheels to the bottom rail (so they don't look split) -->
  <line x1="66"  y1="144" x2="66"  y2="158"
        stroke="#e8c97a" stroke-width="11" stroke-linecap="round"/>
  <line x1="124" y1="144" x2="124" y2="158"
        stroke="#e8c97a" stroke-width="11" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="66"  cy="168" r="14" fill="#e8c97a"/>
  <circle cx="124" cy="168" r="14" fill="#e8c97a"/>

</svg>
