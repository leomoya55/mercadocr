<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1C3F90"/>
      <stop offset="100%" stop-color="#0E2560"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B8101E"/>
      <stop offset="100%" stop-color="#800C16"/>
    </linearGradient>
    <clipPath id="basket">
      <rect x="30" y="38" width="118" height="88" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Flag stripes clipped to rounded basket — no gold border yet -->
  <g clip-path="url(#basket)">
    <rect x="0" y="0" width="200" height="200" fill="url(#navy)"/>
    <!-- Left white swoosh -->
    <path d="M 58,28  C 44,82  56,138  50,144
             L 72,144
             C 78,138  66,82   80,28 Z"
          fill="#DDD8CC"/>
    <!-- Crimson centre -->
    <path d="M 80,28  C 66,82  78,138  72,144
             L 118,144
             C 124,138 112,82  126,28 Z"
          fill="url(#crimson)"/>
    <!-- Right white swoosh -->
    <path d="M 126,28 C 112,82 124,138 118,144
             L 140,144
             C 146,138 134,82  148,28 Z"
          fill="#DDD8CC"/>
  </g>

  <!-- Gold basket border — exact same as estasies.png, color #e8c97a -->
  <rect x="30" y="38" width="118" height="88" rx="16" ry="16"
        fill="none"
        stroke="#e8c97a"
        stroke-width="10"/>

  <!-- Handle -->
  <path d="M 148,70
           C 162,64 174,54 174,40
           Q 174,28 160,28"
        fill="none"
        stroke="#e8c97a"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <line x1="174" y1="40" x2="174" y2="118"
        stroke="#e8c97a"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Axle -->
  <line x1="50" y1="142" x2="140" y2="142"
        stroke="#e8c97a"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="68"  cy="158" r="14" fill="#e8c97a"/>
  <circle cx="122" cy="158" r="14" fill="#e8c97a"/>

</svg>
