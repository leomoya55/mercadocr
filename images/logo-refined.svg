<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 461 320">
  <defs>
    <!-- Tilted trapezoid basket — wider at top, narrower at bottom, top edge slopes up to the right -->
    <clipPath id="basket">
      <path d="M 104,69
               L 342,54
               Q 355,53 353,70
               L 325,208
               Q 322,222 307,222
               L 131,222
               Q 116,222 117,208
               L 86,86
               Q 84,72 104,69 Z"/>
    </clipPath>
  </defs>

  <!-- ── Costa Rica flag — horizontal stripes (blue/white/red/white/blue) clipped to basket ── -->
  <g clip-path="url(#basket)">
    <!-- proportions 1:1:2:1:1 across basket height (54 → 222) -->
    <rect x="60" y="50"  width="330" height="30" fill="#002B7F"/>  <!-- blue  -->
    <rect x="60" y="80"  width="330" height="29" fill="#FFFFFF"/>  <!-- white -->
    <rect x="60" y="109" width="330" height="58" fill="#CE1126"/>  <!-- red   -->
    <rect x="60" y="167" width="330" height="29" fill="#FFFFFF"/>  <!-- white -->
    <rect x="60" y="196" width="330" height="34" fill="#002B7F"/>  <!-- blue  -->
  </g>

  <!-- ── Gold cart frame — ONE continuous stroke: bottom rail → rounded corner → right post → handle hook ── -->
  <path d="M 122,242
           L 332,242
           Q 360,242 362,214
           L 362,92
           C 362,64 380,50 402,52"
        fill="none"
        stroke="#e8c97a"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Wheel legs — connect wheels to the rail -->
  <line x1="166" y1="242" x2="166" y2="266"
        stroke="#e8c97a" stroke-width="22" stroke-linecap="round"/>
  <line x1="290" y1="242" x2="290" y2="266"
        stroke="#e8c97a" stroke-width="22" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="166" cy="286" r="26" fill="#e8c97a"/>
  <circle cx="290" cy="286" r="26" fill="#e8c97a"/>

</svg>
