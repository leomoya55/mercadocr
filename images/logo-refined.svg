<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 178">
  <defs>

    <!-- Warm muted gold — harmonizes with #e8c97a navbar text -->
    <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#E0B840"/>
      <stop offset="100%" stop-color="#A87818"/>
    </linearGradient>

    <!-- Deep navy — Costa Rica blue, desaturated for dark UI -->
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A3A8A"/>
      <stop offset="100%" stop-color="#0C2060"/>
    </linearGradient>

    <!-- Deep crimson — Costa Rica red, toned down -->
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#AA0F1C"/>
      <stop offset="100%" stop-color="#720A14"/>
    </linearGradient>

    <!-- Clip to rounded-rectangle basket (matches estasies.png style) -->
    <clipPath id="basket">
      <rect x="14" y="20" width="138" height="102" rx="18" ry="18"/>
    </clipPath>

  </defs>

  <!-- ── Flag stripes clipped to rounded basket ──────────────────────── -->
  <g clip-path="url(#basket)">

    <!-- Navy base fills entire basket -->
    <rect x="0" y="0" width="200" height="200" fill="url(#navy)"/>

    <!-- Left warm-white swoosh stripe -->
    <path d="M 46,12
             C 34,70  44,126  38,132
             L 58,132
             C 64,126  54,70   66,12 Z"
          fill="#DAD5C8"/>

    <!-- Crimson centre band -->
    <path d="M 66,12
             C 54,70  64,126  58,132
             L 108,132
             C 114,126 104,70  116,12 Z"
          fill="url(#crimson)"/>

    <!-- Right warm-white swoosh stripe -->
    <path d="M 116,12
             C 104,70  114,126 108,132
             L 128,132
             C 134,126 124,70  136,12 Z"
          fill="#DAD5C8"/>

    <!-- Right navy — rest of basket already covered by base -->

  </g>

  <!-- ── Rounded basket border ─────────────────────────────────────────── -->
  <rect x="14" y="20" width="138" height="102" rx="18" ry="18"
        fill="none"
        stroke="url(#gold)"
        stroke-width="10"/>

  <!-- ── Handle: curves up from basket top-right, hooks, grips down ─────── -->
  <path d="M 152,58
           C 166,52 180,42 180,28
           Q 180,14 166,14"
        fill="none"
        stroke="url(#gold)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Grip — vertical bar on right -->
  <line x1="180" y1="28" x2="180" y2="108"
        stroke="url(#gold)"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- ── Axle ────────────────────────────────────────────────────────────── -->
  <line x1="36" y1="138" x2="126" y2="138"
        stroke="url(#gold)"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- ── Wheels ─────────────────────────────────────────────────────────── -->
  <circle cx="54"  cy="156" r="14" fill="url(#gold)"/>
  <circle cx="108" cy="156" r="14" fill="url(#gold)"/>

</svg>
