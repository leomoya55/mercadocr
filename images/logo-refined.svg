<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 192">
  <defs>
    <clipPath id="basket">
      <rect x="12" y="22" width="142" height="108" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- ── Flag colors — open, no gold border around them ─────────────── -->
  <g clip-path="url(#basket)">
    <rect x="0" y="0" width="210" height="192" fill="#0038A8"/>

    <!-- Left white swoosh -->
    <path d="M 56,14  C 40,68  54,130  46,138
             L 72,138
             C 80,130  66,68   82,14 Z"
          fill="#FFFFFF"/>

    <!-- Red centre -->
    <path d="M 82,14  C 66,68  80,130  72,138
             L 124,138
             C 132,130 118,68  134,14 Z"
          fill="#CE1126"/>

    <!-- Right white swoosh -->
    <path d="M 134,14 C 118,68 132,130 124,138
             L 150,138
             C 158,130 144,68  160,14 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- ── Gold only on right + bottom of cart, handle, axle, wheels ───── -->

  <!-- Cart frame: rounded U-shape — both bottom corners curved, right side up to handle -->
  <path d="M 12,108
           Q 12,130 34,130
           L 134,130
           Q 154,130 154,108
           L 154,66"
        fill="none"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Handle: curves up from basket right, hooks, drops as grip -->
  <path d="M 154,66
           C 170,58 184,48 184,32
           Q 184,18 168,18"
        fill="none"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Grip — vertical bar -->
  <line x1="184" y1="32" x2="184" y2="118"
        stroke="#e8c97a"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Axle -->
  <line x1="34" y1="150" x2="146" y2="150"
        stroke="#e8c97a"
        stroke-width="11"
        stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="54"  cy="168" r="16" fill="#e8c97a"/>
  <circle cx="126" cy="168" r="16" fill="#e8c97a"/>

</svg>
