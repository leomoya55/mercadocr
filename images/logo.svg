<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 100" role="img" aria-label="MercadoCR logo">
  <defs>
    <!--
      Basket clip — wide at top (8–88 = 80 px), converges toward bottom (20–68 = 48 px),
      rounded bottom corners.  Left side leans slightly right as it descends; right
      side leans significantly left (creating the characteristic cart taper).
    -->
    <clipPath id="bc">
      <path d="M8,4 H88 L68,72 Q66,78 58,78 H30 Q22,78 20,72 Z"/>
    </clipPath>
  </defs>

  <!--
    ── Flag stripes ─────────────────────────────────────────────────────────────
    Straight diagonal trapezoids (not beziers) — each divider shifts 20 px to the
    right from top (y=0) to bottom (y=78), producing the flowing diagonal effect.

      Divider    top-x   bottom-x
        D1        32       52      ← left-blue / white boundary
        D2        40       60      ← white / red boundary
        D3        63       83      ← red / white boundary
        D4        71       91      ← white / right-blue boundary

    At the top  (basket x 8–88):   all five bands are visible.
    At the bottom (basket x 20–68): D3 and D4 exceed the right basket edge,
    so the left blue dominates — exactly as in the reference image.
  -->
  <g clip-path="url(#bc)">
    <!-- Blue left -->
    <path d="M0,0 H32 L52,78 H0 Z"   fill="#003DA5"/>
    <!-- White separator -->
    <path d="M32,0 H40 L60,78 H52 Z" fill="#ffffff"/>
    <!-- Red centre -->
    <path d="M40,0 H63 L83,78 H60 Z" fill="#CE1126"/>
    <!-- White separator -->
    <path d="M63,0 H71 L91,78 H83 Z" fill="#ffffff"/>
    <!-- Blue right -->
    <path d="M71,0 H118 V78 H91 Z"   fill="#003DA5"/>
  </g>

  <!--
    ── Gold cart — ONE continuous stroke ────────────────────────────────────────
    Single path: starts at top-left, traces left side → bottom → right side →
    transitions directly into the handle arc (cubic bézier for smooth join at the
    basket/handle corner) → straight handle grip.

    Using one path means no visible gap or bump where the basket meets the handle.
    stroke-linecap:round gives the characteristic rounded ends seen in the reference.
  -->
  <path d="M8,4
           L20,72 Q22,78 30,78 H58 Q66,78 68,72
           L88,4
           C96,3 112,12 112,28
           L112,54"
        fill="none"
        stroke="#e8c97a"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Axle bar -->
  <line x1="24" y1="81" x2="66" y2="81"
        stroke="#e8c97a" stroke-width="12" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="32" cy="91" r="9.5" fill="#e8c97a"/>
  <circle cx="58" cy="91" r="9.5" fill="#e8c97a"/>
</svg>
