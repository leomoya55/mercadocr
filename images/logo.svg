<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 92" role="img" aria-label="MercadoCR logo">
  <defs>
    <!--
      Basket clip — wider at top, slight convergence at bottom, rounded lower corners.
      All flag stripes are clipped to this shape.
    -->
    <clipPath id="c">
      <path d="M10,5 H92 L85,69 Q84,74 79,74 H23 Q18,74 17,69 Z"/>
    </clipPath>
  </defs>

  <!--
    Flag stripes — all dividing lines are quadratic béziers that bow LEFT as they
    descend, so the stripes flow diagonally from lower-left to upper-right, matching
    the waving-flag effect in your logo image.

    Divider positions (verified with t=0.5 midpoint calculation):
      D1: top=(30,0)  ctrl=(18,37)  bottom=(38,74)
      D2: top=(38,0)  ctrl=(26,37)  bottom=(46,74)
      D3: top=(62,0)  ctrl=(50,37)  bottom=(70,74)
      D4: top=(70,0)  ctrl=(58,37)  bottom=(78,74)

    All white separators are exactly 8 px wide at every y — confirmed analytically.
  -->
  <g clip-path="url(#c)">
    <!-- Blue left -->
    <path d="M0,0 H30 Q18,37 38,74 H0 Z"           fill="#003DA5"/>
    <!-- White separator -->
    <path d="M30,0 Q18,37 38,74 H46 Q26,37 38,0 Z" fill="#ffffff"/>
    <!-- Red centre -->
    <path d="M38,0 Q26,37 46,74 H70 Q50,37 62,0 Z" fill="#CE1126"/>
    <!-- White separator -->
    <path d="M62,0 Q50,37 70,74 H78 Q58,37 70,0 Z" fill="#ffffff"/>
    <!-- Blue right -->
    <path d="M70,0 Q58,37 78,74 H114 V0 Z"         fill="#003DA5"/>
  </g>

  <!-- Cart basket outline (gold) -->
  <path d="M10,5 H92 L85,69 Q84,74 79,74 H23 Q18,74 17,69 Z"
        fill="none" stroke="#e8c97a" stroke-width="7" stroke-linejoin="round"/>

  <!-- Handle — arc from basket top-right, sweeping right then down -->
  <path d="M92,6 Q109,5 110,22 L110,46"
        fill="none" stroke="#e8c97a" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Axle bar connecting wheels -->
  <line x1="26" y1="74" x2="74" y2="74"
        stroke="#e8c97a" stroke-width="7" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="34" cy="84" r="8.5" fill="#e8c97a"/>
  <circle cx="66" cy="84" r="8.5" fill="#e8c97a"/>
</svg>
