<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - MercadoCR</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MercadoCR</div>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/listings">Anuncios</a></li>
                <li class="nav-hidden" data-auth-only><a href="/publish" data-publish-cta>Publicar</a></li>
                <li><a href="/pricing">Planes</a></li>
                <li data-guest-only><a href="/login">Iniciar sesión</a></li>
                <li class="nav-hidden nav-user-menu" data-auth-only id="nav-user-menu">
                    <button class="nav-user-btn" id="nav-user-btn" type="button"></button>
                    <ul class="nav-dropdown">
                        <li><a href="/dashboard">Mi panel</a></li>
                        <li><a href="/settings">Configuración</a></li>
                        <li><button class="nav-logout-btn" id="nav-logout" type="button">Salir</button></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="settings-page">
            <h2>Configuración</h2>
            <p>Administra tu perfil y preferencias de cuenta.</p>

            <!-- Profile section -->
            <div class="settings-section">
                <h3>Información de perfil</h3>
                <form class="settings-form" id="profile-form">
                    <div class="form-row">
                        <div>
                            <label for="s-nombre">Nombre</label>
                            <input type="text" id="s-nombre" name="nombre" required>
                        </div>
                        <div>
                            <label for="s-apellido">Apellido</label>
                            <input type="text" id="s-apellido" name="apellido" required>
                        </div>
                    </div>

                    <label for="s-phone">Número de teléfono</label>
                    <input type="tel" id="s-phone" name="phone" required placeholder="8888-8888">

                    <label for="s-provincia">Provincia</label>
                    <select id="s-provincia" name="provincia" required>
                        <option value="">Selecciona tu provincia</option>
                        <option value="San José">San José</option>
                        <option value="Alajuela">Alajuela</option>
                        <option value="Cartago">Cartago</option>
                        <option value="Heredia">Heredia</option>
                        <option value="Guanacaste">Guanacaste</option>
                        <option value="Puntarenas">Puntarenas</option>
                        <option value="Limón">Limón</option>
                    </select>

                    <div class="settings-status" id="profile-status"></div>
                    <button type="submit" class="cta-button settings-save-btn" id="profile-save">Guardar cambios</button>
                </form>
            </div>

            <!-- Password section -->
            <div class="settings-section">
                <h3>Cambiar contraseña</h3>
                <form class="settings-form" id="password-form">
                    <label for="s-current-password">Contraseña actual</label>
                    <input type="password" id="s-current-password" name="currentPassword" required>

                    <label for="s-new-password">Nueva contraseña</label>
                    <input type="password" id="s-new-password" name="newPassword" required minlength="6">

                    <label for="s-confirm-password">Confirmar nueva contraseña</label>
                    <input type="password" id="s-confirm-password" name="confirmPassword" required>

                    <div class="settings-status" id="password-status"></div>
                    <button type="submit" class="cta-button settings-save-btn" id="password-save">Cambiar contraseña</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MercadoCR. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/config.js?v=7"></script>
    <script src="js/auth-redirect.js?v=7"></script>
    <script src="js/settings.js?v=7"></script>
</body>
</html>
