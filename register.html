<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MercadoCR</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">MercadoCR</div>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/listings">Anuncios</a></li>
                <li class="nav-hidden" data-auth-only><a href="/publish" data-publish-cta>Publicar</a></li>
                <li><a href="/pricing">Planes</a></li>
                <li data-guest-only><a href="/login">Iniciar sesión</a></li>
                <li class="nav-hidden nav-user-menu" data-auth-only id="nav-user-menu">
                    <button class="nav-user-btn" id="nav-user-btn" type="button"></button>
                    <ul class="nav-dropdown">
                        <li><a href="/dashboard">Mi panel</a></li>
                        <li><a href="/settings">Configuración</a></li>
                        <li><button class="nav-logout-btn" id="nav-logout" type="button">Salir</button></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-page">
            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div>
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                </div>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Número de teléfono</label>
                <input type="tel" id="phone" name="phone">
                <small>Tu número será visible para compradores interesados en tus anuncios.</small>

                <label for="provincia">Provincia</label>
                <select id="provincia" name="provincia" required>
                    <option value="">Selecciona tu provincia</option>
                    <option value="San José">San José</option>
                    <option value="Alajuela">Alajuela</option>
                    <option value="Cartago">Cartago</option>
                    <option value="Heredia">Heredia</option>
                    <option value="Guanacaste">Guanacaste</option>
                    <option value="Puntarenas">Puntarenas</option>
                    <option value="Limón">Limón</option>
                </select>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <button type="submit" class="cta-button">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="/login">Inicia Sesión</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MercadoCR. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/config.js?v=12"></script>
    <script src="js/auth-redirect.js?v=12"></script>
    <script src="js/register.js?v=12"></script>
</body>
</html>
