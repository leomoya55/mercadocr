<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/logo-refined.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MercaTico</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Optional error monitoring: paste your Sentry frontend DSN to enable. -->
    <meta name="sentry-dsn" content="">
    <script src="js/sentry-init.js?v=12"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo"><img src="/images/logo-refined.svg" class="logo-img" alt="" aria-hidden="true" width="50" height="42"><span>MercaTico</span></a>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/listings">Anuncios</a></li>
                <li class="nav-hidden" data-auth-only><a href="/publish" data-publish-cta>Publicar</a></li>
                <li><a href="/pricing">Planes</a></li>
                <li data-guest-only><a href="/login">Iniciar sesión</a></li>
                <li class="nav-hidden nav-user-menu" data-auth-only id="nav-user-menu">
                    <button class="nav-user-btn" id="nav-user-btn" type="button"></button>
                    <ul class="nav-dropdown">
                        <li class="nav-hidden" data-admin-only><a href="/admin">Admin</a></li>
                        <li><a href="/dashboard">Mi panel</a></li>
                        <li><a href="/settings">Configuración</a></li>
                        <li><button class="nav-logout-btn" id="nav-logout" type="button">Salir</button></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-page">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <p id="login-error" style="color:#e08080;font-size:0.88rem;margin:0;display:none;"></p>

                <button type="submit" class="cta-button">Iniciar Sesión</button>
            </form>
            <div id="status-message" class="status-message"></div>
            <div class="auth-links">
                <a href="/register.html">¿No tienes una cuenta? Regístrate</a>
                <a href="/forgot-password.html" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
            </div>
        </section>
    </main>

    <footer>
        <nav class="footer-links">
            <a href="/terminos">Términos y condiciones</a>
            <a href="/privacidad">Política de privacidad</a>
        </nav>
        <p>&copy; 2026 MercaTico. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth-redirect.js?v=12"></script>
    <script src="js/login.js"></script>
</body>
</html>
