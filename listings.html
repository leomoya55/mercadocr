<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/logo-refined.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncios - MercaTico</title>
    <meta name="description" content="Encuentra los mejores anuncios de Costa Rica en MercaTico. Ropa, electrónica, vehículos, hogar y más.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/listings.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo"><img src="/images/logo-refined.svg" class="logo-img" alt="" aria-hidden="true" width="50" height="42"><span>MercaTico</span></a>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/listings">Anuncios</a></li>
                <li><a href="/empleos">Empleos</a></li>
                <li class="nav-hidden" data-auth-only><a href="/publish" data-publish-cta>Publicar</a></li>
                <li><a href="/pricing">Planes</a></li>
                <li data-guest-only><a href="/login">Iniciar sesión</a></li>
                <li class="nav-hidden nav-user-menu" data-auth-only id="nav-user-menu">
                    <button class="nav-user-btn" id="nav-user-btn" type="button"></button>
                    <ul class="nav-dropdown">
                        <li class="nav-hidden" data-admin-only><a href="/admin">Admin</a></li>
                        <li><a href="/dashboard">Mi panel</a></li>
                        <li><a href="/settings">Configuración</a></li>
                        <li><button class="nav-logout-btn" id="nav-logout" type="button">Salir</button></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="listings-layout">
        <aside class="categories-sidebar">
            <h3>Categorías</h3>
            <!-- Populated from the shared taxonomy (js/categories.js) by listings.js. -->
            <nav class="category-nav" id="category-nav" aria-label="Categorías"></nav>
        </aside>
        <section class="listings-page">
            <h2>Todos los anuncios</h2>

            <div class="search-bar">
                <input type="search" id="search-q" placeholder="Buscar anuncios..." autocomplete="off">
                <button id="search-btn" type="button">Buscar</button>
            </div>

            <div class="filters">
                <select id="filter-condition">
                    <option value="">Cualquier estado</option>
                    <option value="new">Nuevo</option>
                    <option value="like_new">Como nuevo</option>
                    <option value="good">Buen estado</option>
                    <option value="fair">Estado regular</option>
                    <option value="regular">Para reparar</option>
                </select>
                <select id="filter-provincia">
                    <option value="">Cualquier provincia</option>
                    <option>San José</option>
                    <option>Alajuela</option>
                    <option>Cartago</option>
                    <option>Heredia</option>
                    <option>Guanacaste</option>
                    <option>Puntarenas</option>
                    <option>Limón</option>
                </select>
                <input type="number" id="min-price" placeholder="Precio mín." min="0">
                <input type="number" id="max-price" placeholder="Precio máx." min="0">
                <select id="filter-sort">
                    <option value="newest">Más recientes</option>
                    <option value="featured">Destacados primero</option>
                    <option value="price_asc">Precio: menor a mayor</option>
                    <option value="price_desc">Precio: mayor a menor</option>
                </select>
                <button id="filter-button" type="button">Aplicar</button>
                <button id="reset-button" type="button" class="btn-secondary">Limpiar</button>
            </div>

            <div id="listings-count" class="listings-count" aria-live="polite"></div>

            <div class="listings-grid" id="listings-container" aria-live="polite">
                <!-- Listings loaded dynamically -->
            </div>

            <div class="listings-pagination" id="listings-pagination"></div>
        </section>
    </main>

    <footer>
        <nav class="footer-links">
            <a href="/terminos">Términos y condiciones</a>
            <a href="/privacidad">Política de privacidad</a>
        </nav>
        <p>&copy; 2026 MercaTico. Todos los derechos reservados.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/config.js?v=13"></script>
    <script src="js/categories.js?v=1"></script>
    <script src="js/ui.js?v=13"></script>
    <script src="js/auth-redirect.js?v=16"></script>
    <script src="js/listings.js?v=18"></script>
</body>
</html>
